# netlify.toml — Configuração de deploy RHCTECH
# Referência: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."        # raiz do projeto = pasta publicada
  # command = ""       # sem build step (HTML puro)

# Redirecionamentos canônicos
[[redirects]]
  from  = "https://www.rhctech.com.br/*"
  to    = "https://rhctech.com.br/:splat"
  status = 301
  force  = true

# Headers de segurança e performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection       = "1; mode=block"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:; connect-src 'self' https://formspree.io;"

# Cache longo para assets estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache médio para HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Página 404 personalizada (criar pages/404.html se quiser)
# [[redirects]]
#   from   = "/*"
#   to     = "/pages/404.html"
#   status = 404
